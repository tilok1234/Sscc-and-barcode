name: Android CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew -p core test --console=plain

  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sscc-scanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Keep a stable, phone-friendly download link:
      # https://github.com/<owner>/<repo>/releases/download/latest/sscc-scanner.apk
      - name: Publish APK to 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sscc-scanner.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest sscc-scanner.apk \
            --title "DCR (Damage Control Register) — build ${{ github.run_number }}" \
            --notes "Auto-built from ${{ github.sha }} (${{ github.ref_name }})"
